[project]
name = "ingestion-service"
version = "0.1.0"
description = "Ingestion Service for Local RAG"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pymupdf",
    "requests",
    "qdrant-client",
    "beautifulsoup4",
    "lxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
