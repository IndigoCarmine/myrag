[project]
name = "myrag-root"
version = "0.1.0"
description = "Local RAG System - Single Root Project"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sentence-transformers",
    "torch",
    "numpy",
    "python-multipart",
    "pymupdf",
    "requests",
    "beautifulsoup4",
    "lxml",
    "qdrant-client",
    "structlog", 
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "respx",
    "pytest-asyncio",
    "poethepoet>=0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.poe.tasks]
start-infra = "docker compose up -d"
start-retrieval = "uv run uvicorn services.retrieval.main:app --host 0.0.0.0 --port 8001"
start-ingestion = "uv run uvicorn services.ingestion.main:app --host 0.0.0.0 --port 8002"
start-embedding = "uv run uvicorn services.embedding.main:app --host 0.0.0.0 --port 8003"
start-frontend = { cmd = "npm.cmd run dev", cwd = "services/frontend" }
test-cli = "uv run python -m services.cli_tester.main"
demo-cli = "uv run python services/cli_tester/demo.py"
check-services = "uv run python services/cli_tester/service_check.py"

[tool.poe.tasks.start-gateway]
env = { OLLAMA_MODEL = "gemma3:4b" }
cmd = "uv run uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000"

[tool.poe.tasks.dev]
env = { OLLAMA_MODEL = "gemma3:4b" }
parallel = ["start-gateway", "start-retrieval", "start-ingestion", "start-embedding", "start-frontend"]
